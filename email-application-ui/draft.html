<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Drafts</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .job-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .job-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .author {
            font-weight: 600;
            color: var(--accent);
            font-size: 16px;
        }

        .card-body p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .email-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        
        .draft-btn {
            padding: 6px 16px;
            font-size: 12px;
            width: auto;
            border-radius: 20px;
            margin: 0;
        }

        /* Scrollbar styles for the container */
        .cards-container::-webkit-scrollbar {
            width: 8px;
        }
        .cards-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1); 
            border-radius: 10px;
        }
        .cards-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 10px;
        }
        .cards-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3); 
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container" style="max-width: 700px;">
        <div class="glass-card" style="padding: 30px;">
            <div class="header">
                <h1>Scraped Job Drafts</h1>
                <p>Review scraped LinkedIn jobs and draft emails instantly.</p>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="searchDate">Select Date & Slot</label>
                    <div class="search-row" style="display: flex; gap: 10px; align-items: stretch;">
                        <input type="text" id="searchDate" placeholder="15-07-26" pattern="\d{2}-\d{2}-\d{2}" style="flex: 0 0 130px; min-width: 130px;">
                        <select id="slotFilter" style="flex: 1; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(15, 23, 42, 0.6); color: var(--text-primary); outline: none;">
                            <option value="All">All Slots</option>
                            <option value="Morning">Morning (00:00 - 10:00)</option>
                            <option value="Noon">Noon (10:00 - 13:00)</option>
                            <option value="Evening">Evening (13:00 - 16:00)</option>
                            <option value="Night">Night (16:00 - 23:59)</option>
                        </select>
                        <button id="fetchBtn" style="flex: 0 0 auto; white-space: nowrap; padding: 0 20px;">
                            <span class="btn-text">Fetch Posts</span>
                            <div class="loader" id="btnLoader"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div id="statusMessage" class="status-message hidden"></div>

            <div class="cards-container" id="cardsContainer">
                <div style="text-align: center; color: var(--text-secondary); padding: 40px 0;">
                    Enter a date and click fetch to see scraped posts.
                </div>
            </div>
            
            <div class="stats-row hidden" id="statsRow" style="margin-top: 15px; font-size: 12px; color: var(--text-secondary); text-align: center;">
                <p>Total posts found: <span id="recordCount" style="color: var(--accent); font-weight: bold;">0</span></p>
            </div>
        </div>
    </div>

    <script src="draft.js"></script>
</body>
</html>
